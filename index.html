<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EL GATO U I I A</title>

<style>

/* 🔥 AJUSTE GLOBAL */
html, body{
    width:100%;
    height:100%;
}

body{
    margin:0;
    overflow:hidden;
    font-family:'Segoe UI', sans-serif;
    color:white;

    /* 🖼️ FONDO PERFECTO */
    background: url("fondo.jpg") no-repeat center center fixed;
    background-size: cover;
    background-color: black;
}

/* 🌙 OVERLAY PRO */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    pointer-events:none;
    z-index:0;
}

/* TÍTULO */
#title{
    position:fixed;
    top:10px;
    right:20px;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
    text-shadow:0 0 10px #00f0ff;
    z-index:2;
}

/* HUD */
#hud{
    position:fixed;
    top:10px;
    left:10px;
    z-index:2;
}

#bar{
    width:220px;
    height:22px;
    border-radius:10px;
    overflow:hidden;
    background:#222;
    box-shadow:0 0 10px #000 inset;
}

#life{
    height:100%;
    width:100%;
    background:linear-gradient(90deg, lime, green);
}

/* GATO */
#cat{
    position:absolute;
    width:120px;
    height:120px;
    cursor:grab;
    z-index:2;
    transition:filter 0.2s;
}

#cat:active{
    cursor:grabbing;
    filter:drop-shadow(0 0 15px #00f0ff);
}

/* PIXEL CAT */
.cat-art{
    width:100%;
    height:100%;
    image-rendering: pixelated;
    background:
    linear-gradient(#222 0 0) 30px 10px/20px 20px no-repeat,
    linear-gradient(#222 0 0) 70px 10px/20px 20px no-repeat,
    linear-gradient(#555 0 0) 20px 30px/80px 60px no-repeat,
    linear-gradient(#fff 0 0) 30px 45px/15px 15px no-repeat,
    linear-gradient(#fff 0 0) 75px 45px/15px 15px no-repeat,
    linear-gradient(#0f0 0 0) 35px 50px/7px 7px no-repeat,
    linear-gradient(#0f0 0 0) 80px 50px/7px 7px no-repeat,
    linear-gradient(pink 0 0) 55px 65px/10px 10px no-repeat,
    linear-gradient(#000 0 0) 50px 80px/20px 4px no-repeat,
    linear-gradient(#666 0 0) 25px 80px/70px 30px no-repeat,
    linear-gradient(#444 0 0) 25px 110px/15px 10px no-repeat,
    linear-gradient(#444 0 0) 80px 110px/15px 10px no-repeat,
    linear-gradient(#555 0 0) 95px 85px/30px 10px no-repeat;
}

/* RATONES */
.mouse{
    position:absolute;
    width:50px;
    height:50px;
    z-index:2;
}

.mouse-art{
    width:100%;
    height:100%;
    image-rendering: pixelated;
    background:
    linear-gradient(#777 0 0) 15px 20px/30px 20px no-repeat,
    linear-gradient(#999 0 0) 10px 10px/10px 10px no-repeat,
    linear-gradient(#999 0 0) 35px 10px/10px 10px no-repeat,
    linear-gradient(#000 0 0) 40px 25px/5px 5px no-repeat,
    linear-gradient(pink 0 0) 45px 30px/5px 5px no-repeat,
    linear-gradient(#444 0 0) 20px 40px/5px 5px no-repeat,
    linear-gradient(#444 0 0) 30px 40px/5px 5px no-repeat,
    linear-gradient(pink 0 0) 45px 35px/20px 3px no-repeat;
}

/* GAME OVER */
#gameover{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:3;
}

#gameover h1{
    font-size:40px;
    text-shadow:0 0 20px red;
}

#gameover button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#ff004c,#ff7a00);
    color:white;
    cursor:pointer;
    box-shadow:0 0 15px #ff004c;
    transition:0.2s;
}

#gameover button:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<div id="title">EL GATO U I I A</div>

<div id="hud">
    VIDA ❤️
    <div id="bar"><div id="life"></div></div>
</div>

<div id="cat"><div class="cat-art"></div></div>

<div id="gameover">
    <h1>💀 El gato murió</h1>
    <button onclick="revive()">Revivir gato pendejo</button>
</div>

<!-- AUDIO -->
<audio id="music" loop>
<source src="musica.mp3">
</audio>

<audio id="eatSound">
<source src="comer.mp3">
</audio>

<audio id="deathSound">
<source src="muerte.mp3">
</audio>

<script>
const cat = document.getElementById("cat");
const lifeBar = document.getElementById("life");
const gameover = document.getElementById("gameover");

const music = document.getElementById("music");
const eatSound = document.getElementById("eatSound");
const deathSound = document.getElementById("deathSound");

let mice = [];

let x=200,y=200,dx=2,dy=2;
let dragging=false;
let life=100;
let alive=true;

/* 🎵 MÚSICA */
document.addEventListener("click",()=>{
    music.volume=0.3;
    music.play();
},{once:true});

/* 🖱️ DRAG */
cat.addEventListener("mousedown",()=>dragging=true);
document.addEventListener("mouseup",()=>dragging=false);
document.addEventListener("mousemove",(e)=>{
if(dragging && alive){
x=e.clientX;
y=e.clientY;
}
});

/* 🐭 RATONES */
function createMouse(){
if(!alive) return;

let m=document.createElement("div");
m.className="mouse";
m.innerHTML='<div class="mouse-art"></div>';

m.style.left=Math.random()*(window.innerWidth-50)+"px";
m.style.top=Math.random()*(window.innerHeight-50)+"px";

document.body.appendChild(m);
mice.push(m);

setTimeout(()=>{
m.remove();
mice=mice.filter(el=>el!==m);
},6000);
}

setInterval(createMouse,2000);

/* 🎮 LOOP */
function update(){

if(alive && !dragging){

if(mice.length){
let target=mice[0];
let mx=target.offsetLeft;
let my=target.offsetTop;

dx=(mx-x)*0.02;
dy=(my-y)*0.02;
}

x+=dx;
y+=dy;

if(x<=0||x>=window.innerWidth-120) dx*=-1;
if(y<=0||y>=window.innerHeight-120) dy*=-1;

cat.style.transform=dx>0?"scaleX(1)":"scaleX(-1)";
}

/* 💥 COLISIÓN */
mice.forEach((m,i)=>{
let dist=Math.hypot(x-m.offsetLeft,y-m.offsetTop);
if(dist<40 && alive){
m.remove();
mice.splice(i,1);
life=Math.min(100,life+10);
eatSound.currentTime=0;
eatSound.play();
}
});

/* ❤️ VIDA */
if(alive){
life-=0.04;
if(life<=0){
life=0;
alive=false;
gameover.style.display="flex";
deathSound.play();
}
}

lifeBar.style.width=life+"%";
cat.style.left=x+"px";
cat.style.top=y+"px";

requestAnimationFrame(update);
}

function revive(){
life=100;
x=200;y=200;
dx=2;dy=2;
alive=true;
gameover.style.display="none";
}

update();
</script>

</body>
</html>
