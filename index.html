
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EL GATO U I I A</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#0f172a;
    font-family:Arial;
    color:white;
}

/* TÍTULO */
#title{
    position:fixed;
    top:10px;
    right:20px;
    font-size:20px;
    font-weight:bold;
}

/* HUD */
#hud{
    position:fixed;
    top:10px;
    left:10px;
}

#bar{
    width:200px;
    height:20px;
    border:2px solid #000;
    background:#333;
}

#life{
    height:100%;
    width:100%;
    background:lime;
}

/* GATO */
#cat{
    position:absolute;
    width:120px;
    height:120px;
    cursor:grab;
}

.cat-art{
    width:100%;
    height:100%;
    image-rendering: pixelated;
    background:
    linear-gradient(#222 0 0) 30px 10px/20px 20px no-repeat,
    linear-gradient(#222 0 0) 70px 10px/20px 20px no-repeat,
    linear-gradient(#555 0 0) 20px 30px/80px 60px no-repeat,
    linear-gradient(#fff 0 0) 30px 45px/15px 15px no-repeat,
    linear-gradient(#fff 0 0) 75px 45px/15px 15px no-repeat,
    linear-gradient(#0f0 0 0) 35px 50px/7px 7px no-repeat,
    linear-gradient(#0f0 0 0) 80px 50px/7px 7px no-repeat,
    linear-gradient(pink 0 0) 55px 65px/10px 10px no-repeat,
    linear-gradient(#000 0 0) 50px 80px/20px 4px no-repeat,
    linear-gradient(#666 0 0) 25px 80px/70px 30px no-repeat,
    linear-gradient(#444 0 0) 25px 110px/15px 10px no-repeat,
    linear-gradient(#444 0 0) 80px 110px/15px 10px no-repeat,
    linear-gradient(#555 0 0) 95px 85px/30px 10px no-repeat;
}

/* RATÓN */
#mouse{
    position:absolute;
    width:60px;
    height:60px;
}

.mouse-art{
    width:100%;
    height:100%;
    image-rendering: pixelated;
    background:
    linear-gradient(#777 0 0) 15px 20px/30px 20px no-repeat,
    linear-gradient(#999 0 0) 10px 10px/10px 10px no-repeat,
    linear-gradient(#999 0 0) 35px 10px/10px 10px no-repeat,
    linear-gradient(#000 0 0) 40px 25px/5px 5px no-repeat,
    linear-gradient(pink 0 0) 45px 30px/5px 5px no-repeat,
    linear-gradient(#444 0 0) 20px 40px/5px 5px no-repeat,
    linear-gradient(#444 0 0) 30px 40px/5px 5px no-repeat,
    linear-gradient(pink 0 0) 45px 35px/20px 3px no-repeat;
}

/* GAME OVER */
#gameover{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#gameover button{
    padding:15px 25px;
    font-size:18px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
    margin-top:20px;
}
</style>
</head>

<body>

<div id="title">EL GATO U I I A</div>

<div id="hud">
    VIDA ❤️
    <div id="bar"><div id="life"></div></div>
</div>

<div id="cat"><div class="cat-art"></div></div>
<div id="mouse" style="display:none;"><div class="mouse-art"></div></div>

<div id="gameover">
    <h1>💀 El gato murió</h1>
    <button onclick="revive()">Revivir gato pendejo</button>
</div>

<!-- 🎵 MÚSICA -->
<audio id="music" loop>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<!-- 🔊 SONIDOS -->
<audio id="eatSound">
    <source src="comer.mp3" type="audio/mpeg">
</audio>

<audio id="deathSound">
    <source src="muerte.mp3" type="audio/mpeg">
</audio>

<script>
const cat = document.getElementById("cat");
const mouse = document.getElementById("mouse");
const lifeBar = document.getElementById("life");
const gameover = document.getElementById("gameover");

const music = document.getElementById("music");
const eatSound = document.getElementById("eatSound");
const deathSound = document.getElementById("deathSound");

let x = 200, y = 200;
let dx = 2, dy = 2;
let dragging = false;
let life = 100;
let alive = true;

cat.style.left = x+"px";
cat.style.top = y+"px";

/* ACTIVAR MÚSICA */
document.addEventListener("click", () => {
    music.volume = 0.3;
    music.play();
}, { once:true });

/* DRAG */
cat.addEventListener("mousedown", ()=> dragging = true);
document.addEventListener("mouseup", ()=> dragging = false);
document.addEventListener("mousemove", (e)=>{
    if(dragging && alive){
        x = e.clientX;
        y = e.clientY;
    }
});

/* RATÓN */
function spawnMouse(){
    if(!alive) return;

    mouse.style.display = "block";
    mouse.style.left = Math.random() * (window.innerWidth-60)+"px";
    mouse.style.top = Math.random() * (window.innerHeight-60)+"px";

    setTimeout(()=>{
        mouse.style.display = "none";
    },5000);
}
setInterval(spawnMouse, 8000);

/* LOOP */
function update(){
    if(alive && !dragging){

        if(mouse.style.display === "block"){
            let mx = mouse.offsetLeft;
            let my = mouse.offsetTop;

            dx = (mx - x) * 0.02;
            dy = (my - y) * 0.02;
        }

        x += dx;
        y += dy;

        if(x <= 0 || x >= window.innerWidth-120) dx *= -1;
        if(y <= 0 || y >= window.innerHeight-120) dy *= -1;

        cat.style.transform = dx > 0 ? "scaleX(1)" : "scaleX(-1)";
    }

    /* COLISIÓN */
    if(mouse.style.display === "block" && alive){
        let dist = Math.hypot(x - mouse.offsetLeft, y - mouse.offsetTop);
        if(dist < 50){
            mouse.style.display = "none";
            life = Math.min(100, life + 15);
            eatSound.currentTime = 0;
            eatSound.play();
        }
    }

    /* VIDA */
    if(alive){
        life -= 0.03;
        if(life <= 0){
            life = 0;
            alive = false;
            gameover.style.display = "flex";
            deathSound.play();
        }
    }

    lifeBar.style.width = life + "%";

    cat.style.left = x + "px";
    cat.style.top = y + "px";

    requestAnimationFrame(update);
}

/* REVIVIR */
function revive(){
    life = 100;
    x = 200;
    y = 200;
    dx = 2;
    dy = 2;
    alive = true;
    gameover.style.display = "none";
}

update();
</script>

</body>
</html>
